name: Checks

on:
  pull_request:
  push:
    branches: [main]
  # Once a week the same checks run on main's latest commit, to catch what changes without a
  # commit: a runner image, a tool fetched at run time, the browser. A failed run is seen
  # through GitHub's own notice, which goes to whoever last changed this line. No job opens an
  # issue: that would need a permission that writes, which no job has.
  schedule:
    - cron: "0 4 * * 1"

# S16: least privilege. No job here needs more than read access, and none uses a secret.
permissions:
  contents: read

# A pull request's newer run cancels its older one. A push to main is never cancelled or
# replaced: each has a group of its own commit, so every commit on main is checked to the end.
# The weekly run is in the group of the commit it runs on: if that commit's push run is still
# going, the weekly one waits for it, and neither is cancelled.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # D12: every commit of a pull request has a conventional subject and its author's sign-off.
  # The repository's own script, run by Node alone: nothing is installed. The two commit ids
  # reach it through the environment, never written into the command.
  commits:
    name: commits (form and sign-off)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base and every commit of the pull request.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/commits.ts "$PR_BASE..$PR_HEAD"
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}

  # V2, S15, S17: what a pull request adds to the dependencies is read before it merges, for
  # known vulnerabilities and for its licence, by GitHub's own action. It fails on a known
  # vulnerability of any severity, in every scope, and on a licence `pnpm static licences` does
  # not allow: the two lists are the same, held by test/unit/dependency-review.test.ts. The LGPL
  # packages are the local toolchain's, as in that check. A licence it cannot detect is reported
  # and does not fail here; `pnpm static licences` fails it. It writes no comment, so the token
  # stays read-only.
  dependencies:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          allow-licenses: MIT, MIT-0, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, CC-BY-4.0, Unlicense, BlueOak-1.0.0, MPL-2.0, Python-2.0
          allow-dependencies-licenses: pkg:npm/@img/sharp-libvips-darwin-arm64, pkg:npm/@img/sharp-libvips-darwin-x64, pkg:npm/@img/sharp-libvips-linux-arm, pkg:npm/@img/sharp-libvips-linux-arm64, pkg:npm/@img/sharp-libvips-linux-ppc64, pkg:npm/@img/sharp-libvips-linux-riscv64, pkg:npm/@img/sharp-libvips-linux-s390x, pkg:npm/@img/sharp-libvips-linux-x64, pkg:npm/@img/sharp-libvips-linuxmusl-arm64, pkg:npm/@img/sharp-libvips-linuxmusl-x64
          comment-summary-in-pr: never

  check:
    name: pnpm check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported Node and the latest LTS.
        node: [24, 26]
    steps:
      # S16: actions are pinned by commit, with the release tag as a comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The copies check compares files with the import commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:workerd

  e2e:
    name: pnpm e2e (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tier 6: the built app in the runner's own Chrome. The server it starts keeps every binding
      # local and uses secrets generated for the run; the job needs no secret and no account.
      - run: pnpm e2e
      # When the run fails, the trace of each failed test is kept for seven days, so a failure
      # seen once can be read afterwards (#47). The repository is public, so anyone may download
      # it. It holds the throwaway instance's own data and nothing else: the
      # pages, requests and answers of a server that lived for this run only, its generated
      # account, password and session, and the test's own mail. The run's other secrets are in
      # `.e2e/`, which is not uploaded. Nothing in it opens anything once the run is over.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
