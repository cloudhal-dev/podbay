packages:
  - "."
  - "packages/*"
  - "modules/*"

# V6 (docs/engineering-rules.md): a version must be three days old before it is installed.
minimumReleaseAge: 4320

# Native build scripts must be approved one by one.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  # Its script only prints a funding banner.
  core-js-pure: false

# V1 (docs/engineering-rules.md, ADR-0018 decision 4): every version of the workspace is written
# here once, exactly; a package names it as "catalog:". scripts/pins.ts holds both.
